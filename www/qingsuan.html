<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轻松算激活码生成器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 50px auto; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border-radius: 20px; padding: 40px; border: 1px solid rgba(255,215,0,0.3); }
        h1 { color: #ffd700; text-align: center; margin-bottom: 30px; font-size: 24px; }
        .input-group { margin-bottom: 20px; }
        label { color: #e0e0e0; display: block; margin-bottom: 8px; font-size: 14px; }
        input { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; color: #fff; font-size: 16px; }
        input:focus { outline: none; border-color: #ffd700; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #ffd700 0%, #ffb700 100%); border: none; border-radius: 10px; color: #1a1a2e; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { transform: translateY(-2px); }
        .result { margin-top: 25px; padding: 15px; background: rgba(0,255,128,0.1); border: 1px solid rgba(0,255,128,0.3); border-radius: 10px; color: #00ff88; word-break: break-all; font-family: monospace; font-size: 14px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>轻松算激活码生成器</h1>
        <div class="input-group">
            <label>16位设备ID</label>
            <input type="text" id="machine" placeholder="例如：96482498f7dac2f3">
        </div>
        <div class="input-group">
            <label>到期时间</label>
            <input type="date" id="expire">
        </div>
        <button onclick="generate()">生成激活码</button>
        <div class="result" id="result"></div>
    </div>
    <script>
        function generate() {
            let machine = document.getElementById('machine').value.trim().replace(/-/g,'').toLowerCase().substring(0,16);
            const expireDate = new Date(document.getElementById('expire').value + 'T00:00:00+08:00');
            const expireMs = expireDate.getTime();
            const raw = `${expireMs}|${machine}`;
            const code = btoa(unescape(encodeURIComponent(raw)));
            const res = document.getElementById('result');
            res.style.display = 'block';
            res.textContent = '激活码：' + code;
            res.onclick = () => { navigator.clipboard.writeText(code); alert('已复制到剪贴板'); }
        }
    </script>
</body>
</html>
